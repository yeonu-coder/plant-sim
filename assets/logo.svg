<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 80" role="img" aria-label="마이플랜테리어 로고">
  <!-- 마이플랜테리어 로고: 새싹 모양 "MY" (초록 한 가지 색) -->
  <defs>
    <!-- 잎 하나: 길이 24, 끝이 뾰족한 모양 (가운데 흰 잎맥) -->
    <g id="leaf">
      <path d="M0 0 Q12 -11 24 0 Q12 11 0 0 Z" fill="#4caf6e"/>
      <path d="M4 0 H17" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="leaf-small">
      <path d="M0 0 Q8 -7 16 0 Q8 7 0 0 Z" fill="#4caf6e"/>
    </g>
  </defs>

  <g fill="none" stroke="#4caf6e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- M -->
    <path d="M12 70 V30 L32 52 L52 30 V70"/>
    <!-- Y의 줄기 -->
    <path d="M94 70 V46"/>
  </g>

  <!-- M 양 끝에서 돋아난 작은 잎 -->
  <use href="#leaf-small" transform="translate(12 28) rotate(-118)"/>
  <use href="#leaf-small" transform="translate(52 28) rotate(-62)"/>

  <!-- Y의 두 팔 = 새싹 떡잎 -->
  <use href="#leaf" transform="translate(94 46) rotate(-128) scale(1.25)"/>
  <use href="#leaf" transform="translate(94 46) rotate(-52) scale(1.25)"/>
</svg>
