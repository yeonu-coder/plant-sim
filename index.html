<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이플랜테리어 - 나에게 맞는 식물 찾기</title>
  <link rel="stylesheet" href="./css/style.css?v=20261101-2">
</head>
<body>
  <main class="app">

    <!-- 1. 시작 화면 -->
    <section id="screen-start" class="screen is-active">
      <div class="hero">
        <img class="hero-logo" src="./assets/logo.svg" alt="" aria-hidden="true">
        <h1 class="title">마이플랜테리어</h1>
        <p class="subtitle">
          새싹을 키우며 몇 가지 질문에 답하면
          우리&nbsp;집에 딱 맞는 식물 3가지를 추천해&nbsp;드려요.
        </p>
      </div>

      <div class="card">
        <h2 class="card-title">식물 키우기 경험이 어느 정도인가요?</h2>
        <div class="level-list">
          <button class="level-btn" data-level="1">
            <span class="level-icon">🌰</span>
            <span class="level-text"><strong>입문자</strong><small>식물을 키워본 적이 없어요</small></span>
          </button>
          <button class="level-btn" data-level="2">
            <span class="level-icon">🌱</span>
            <span class="level-text"><strong>초보자</strong><small>한두 번 키워봤어요</small></span>
          </button>
          <button class="level-btn" data-level="3">
            <span class="level-icon">🪴</span>
            <span class="level-text"><strong>중급자</strong><small>몇 가지 식물을 잘 키우고 있어요</small></span>
          </button>
          <button class="level-btn" data-level="4">
            <span class="level-icon">🌳</span>
            <span class="level-text"><strong>고수</strong><small>까다로운 식물도 자신 있어요</small></span>
          </button>
        </div>
      </div>

      <div class="center collection-link">
        <button class="btn btn-sub" data-go="screen-collection">📖 내 식물 도감</button>
      </div>
    </section>

    <!-- 2. 시뮬레이션 게임 화면 -->
    <section id="screen-game" class="screen">
      <div class="game-top">
        <div class="progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="progress-text" id="progress-text"></span>
        </div>
      </div>

      <div class="sprout-stage">
        <span class="grow-pop" id="grow-pop">쑥쑥!</span>
        <img class="sprout-img" id="sprout-img" src="./assets/sprout/stage1.svg" alt="자라는 새싹">
        <p class="stage-name" id="stage-name"></p>
      </div>

      <!-- 질문 카드 -->
      <div class="card" id="question-card">
        <span class="action-chip" id="question-action"></span>
        <h2 class="card-title" id="question-text"></h2>
        <div class="option-list" id="option-list" role="radiogroup" aria-labelledby="question-text"></div>
      </div>

      <!-- 다 자랐을 때 -->
      <div class="card center" id="game-done" hidden>
        <h2 class="card-title">새싹이 다 자랐어요! 🌸</h2>
        <p class="muted">이제 나에게 맞는 식물을 알아볼까요?</p>
      </div>

      <!-- [이전] [다음]: 첫 질문에서는 [처음으로], 마지막 질문에서는 [다 키웠어요!] -->
      <div class="game-nav">
        <button class="btn btn-sub" id="prev-btn">이전</button>
        <button class="btn btn-main" id="next-btn" disabled>다음</button>
      </div>
    </section>

    <!-- 3. 결과 화면 -->
    <section id="screen-result" class="screen">
      <div class="result-hero">
        <img class="result-character" src="./assets/sprout/stage5.svg" alt="다 자란 식물 캐릭터">
        <h2 class="result-title">새싹이 다 자라서<br>꼭 맞는 친구 3명을 데려왔어요!</h2>
      </div>

      <div class="answer-chips" id="answer-chips"></div>
      <div class="plant-cards" id="plant-cards"></div>

      <p class="small-note">일부 식물 정보는 AI 초안이라 실제와 다를 수 있어요.</p>
      <div class="button-row">
        <button class="btn btn-sub" data-go="screen-collection">📖 도감 보기</button>
        <button class="btn btn-sub" data-go="screen-start">처음부터 다시 하기</button>
      </div>
    </section>

    <!-- 5. 구매 화면 -->
    <section id="screen-shop" class="screen">
      <button class="back-btn" id="shop-back" aria-label="돌아가기">←</button>
      <h2 class="screen-title">어느 꽃집에서 데려올까요?</h2>

      <div class="card shop-plant" id="shop-plant"></div>

      <div class="shop-list" id="shop-list" role="radiogroup" aria-label="꽃집 고르기"></div>

      <button class="btn btn-main btn-block" id="order-btn" disabled>꽃집을 골라 주세요</button>
      <p class="small-note demo-note">실제 결제가 아닌 시연용 화면이에요.</p>
    </section>

    <!-- 6. 주문 완료 화면 -->
    <section id="screen-done" class="screen">
      <div class="done-hero">
        <p class="done-emoji" aria-hidden="true">🎉</p>
        <h2 class="result-title">주문 완료!</h2>
      </div>

      <div class="card">
        <dl class="detail-facts" id="order-summary"></dl>
        <p class="collect-message" id="collect-message"></p>
        <div id="badge-celebration"></div>
      </div>

      <div class="button-row">
        <button class="btn btn-main" data-go="screen-collection">📖 도감에서 보기</button>
        <button class="btn btn-sub" id="done-result-btn" data-go="screen-result">추천 결과로</button>
      </div>
      <p class="small-note demo-note">실제 결제가 아닌 시연용 화면이에요.</p>
    </section>

    <!-- 7. 도감 화면 -->
    <section id="screen-collection" class="screen">
      <button class="back-btn" id="collection-back" aria-label="돌아가기">←</button>
      <h2 class="screen-title">📖 내 식물 도감</h2>

      <div class="card collection-summary">
        <p class="collection-count"><strong id="collection-count">0</strong> / <span id="collection-total">20</span></p>
        <div class="progress-bar"><div class="progress-fill" id="collection-fill"></div></div>
        <div class="badge-list" id="badge-list"></div>
      </div>

      <div class="collection-grid" id="collection-grid"></div>

      <div class="center">
        <button class="reset-btn" id="reset-btn">도감 초기화 (시연용)</button>
      </div>
    </section>

  </main>

  <!-- 4. 상세보기 (결과 화면 위에 뜨는 팝업) -->
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-name">
    <div class="detail-inner">
      <button class="detail-close" id="detail-close" aria-label="닫기">✕</button>
      <div id="detail-content"></div>
      <button class="btn btn-main btn-block" id="adopt-btn">이 식물 데려오기</button>
    </div>
  </dialog>

  <script src="./js/data/plants.js?v=20261101-2"></script>
  <script src="./js/data/questions.js?v=20261101-2"></script>
  <script src="./js/data/shops.js?v=20261101-2"></script>
  <script src="./js/storage.js?v=20261101-2"></script>
  <script src="./js/recommend.js?v=20261101-2"></script>
  <script src="./js/plant-image.js?v=20261101-2"></script>
  <script src="./js/app.js?v=20261101-2"></script>
</body>
</html>
